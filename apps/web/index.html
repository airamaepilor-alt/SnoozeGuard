<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SnoozeGuard</title>
    <!-- Anti-FOUC: apply saved theme before React mounts -->
    <script>
      (function () {
        var t = localStorage.getItem("sg-theme");
        var el = document.documentElement;
        // Default to dark (matches mobile default)
        if (t === "light") {
          el.classList.remove("dark");
        } else {
          el.classList.add("dark");
        }
        // Suppress transitions on first paint
        el.classList.add("no-transition");
        window.addEventListener("load", function () {
          el.classList.remove("no-transition");
        });
      })();
    </script>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap"
    />
  </head>
  <body class="min-h-dvh bg-background font-body text-on-surface selection:bg-primary/30">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
