<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>SnoozeGuard | Login</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet"/>

                extend: {

                        "on-tertiary-container": "#eb4141",
                        "surface-bright": "#31394d",
                        "on-error": "#690005",

                        "on-surface": "#dae2fd",

                        "on-primary": "#00354a",

                        "inverse-on-surface": "#283044",

                        "error": "#ffb4ab",
                        "inverse-primary": "#00668a",
                        "tertiary-fixed": "#ffdad7",
                        "surface-dim": "#0b1326",
                        "primary-container": "#001a27",
                        "on-secondary": "#472a00",
                        "inverse-surface": "#dae2fd",
                        "on-tertiary-fixed": "#410004",
                        "on-background": "#dae2fd",
                        "primary-fixed-dim": "#7bd0ff",
                        "surface": "#0b1326",
                        "secondary": "#ffb95f",
                        "primary": "#7bd0ff",
                        "surface-container-lowest": "#060e20",
                        "tertiary": "#ffb3ad",

                        "outline-variant": "#45464d",
                        "outline": "#909097",
                        "secondary-fixed": "#ffddb8",
                        "primary-fixed": "#c4e7ff",

                        "error-container": "#93000a",

                    fontFamily: {
                        "headline": ["Manrope"],
                        "body": ["Inter"],
                        "label": ["Inter"]
                    },
                    borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
        .glass-panel {
            background: rgba(34, 42, 61, 0.8);
            backdrop-filter: blur(32px);
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .glow-button {
            background: linear-gradient(135deg, #7bd0ff 0%, #008abb 100%);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-surface font-body selection:bg-primary/30 min-h-screen flex flex-col items-center justify-center overflow-hidden">
<!-- Subtle Background Texture -->
<div class="fixed inset-0 z-0 pointer-events-none overflow-hidden">
<div class="absolute -top-[20%] -left-[10%] w-[60%] h-[60%] bg-primary/5 rounded-full blur-[120px]"></div>
<div class="absolute -bottom-[20%] -right-[10%] w-[50%] h-[50%] bg-secondary/5 rounded-full blur-[120px]"></div>
<div class="absolute inset-0 bg-[url('https://www.transparenttextures.com/patterns/dark-matter.png')] opacity-20 pointer-events-none"></div>
</div>
<!-- Main Content Container -->
<main class="relative z-10 w-full max-w-md px-6 py-12 md:py-0">
<!-- Header / Logo Area -->
<div class="flex flex-col items-center text-center mb-10">
<div class="mb-6 flex items-center justify-center w-16 h-16 rounded-2xl bg-surface-container-high border border-outline-variant/15 shadow-xl">
<span class="material-symbols-outlined text-primary text-4xl" data-icon="security" style="font-variation-settings: 'FILL' 1;">security</span>
</div>
<h1 class="font-headline font-black text-3xl tracking-tighter text-primary mb-2">SnoozeGuard</h1>
<p class="font-body text-on-surface-variant text-sm max-w-[280px]">Sleep Detection System — sign in with Supabase Auth (email or OAuth).</p>
</div>
<!-- Login Card -->
<div class="surface-container rounded-3xl p-8 shadow-2xl border border-outline-variant/10">
<form action="#" class="space-y-6">
<!-- Social Login Section -->
<div class="space-y-3">
<button class="w-full flex items-center justify-center gap-3 h-14 rounded-xl bg-surface-bright border border-outline-variant/20 hover:bg-surface-variant transition-all active:scale-[0.98]" type="button">
<img alt="Google" class="w-5 h-5" data-alt="Minimalist Google G logo with clean white spacing on a dark dashboard background" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAKTUHGF5p3P5nuJMAfQ2mdpx-AXFI3zR0KyAA35Zr1PQCPqEfTinI_2_r-i8_7PEz3jX7K_KWIIOVa1_NVgsukmIUa29VWPPqH7UlwWOdQwgobRmlLJrECMhVKG3aPPYSsUsvcGrxdVMxGAQAph-LlKBwvY55RbuPynVBCgNXnofrbutXz9EJD0LGZQNP2FZhjstdijuSU1kxYXBWbZ-rZwwqskC5hIWv720toX33-3hoP-a-BiKAmrO3LG21pLMLVTdohOk0PpHA"/>
<span class="font-label font-semibold text-sm tracking-wide">Continue with Google</span>
</button>
</div>
<!-- Divider -->
<div class="flex items-center gap-4 py-2">
<div class="h-px flex-1 bg-outline-variant/20"></div>
<span class="text-on-surface-variant font-label text-[10px] uppercase tracking-[0.2em]">OR EMAIL</span>
<div class="h-px flex-1 bg-outline-variant/20"></div>
</div>
<!-- Email Input -->
<div class="space-y-1.5">
<label class="text-on-surface-variant font-label text-[11px] uppercase tracking-widest px-1" for="email">Identity</label>
<div class="relative group">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant group-focus-within:text-primary transition-colors text-lg" data-icon="alternate_email">alternate_email</span>
<input class="w-full h-14 bg-surface-container-low border-none rounded-xl pl-12 pr-4 text-on-surface placeholder:text-outline/40 focus:ring-2 focus:ring-primary/20 transition-all font-body" id="email" placeholder="email@example.com" type="email"/>
</div>
</div>
<!-- Password Input -->
<div class="space-y-1.5">
<div class="flex justify-between items-center px-1">
<label class="text-on-surface-variant font-label text-[11px] uppercase tracking-widest" for="password">Secret Key</label>
<a class="text-primary/70 hover:text-primary text-[10px] uppercase font-bold tracking-widest transition-colors" href="#">Forgot?</a>
</div>
<div class="relative group">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant group-focus-within:text-primary transition-colors text-lg" data-icon="lock" style="font-variation-settings: 'FILL' 1;">lock</span>
<input class="w-full h-14 bg-surface-container-low border-none rounded-xl pl-12 pr-4 text-on-surface placeholder:text-outline/40 focus:ring-2 focus:ring-primary/20 transition-all font-body" id="password" placeholder="••••••••" type="password"/>
</div>
</div>
<!-- Submit Button -->
<button class="glow-button w-full h-16 rounded-2xl flex items-center justify-center gap-2 group transition-all hover:brightness-110 active:scale-[0.97] shadow-lg shadow-primary/10" type="submit" formaction="dashboard.html">
<span class="font-headline font-bold text-on-primary-container text-lg tracking-tight">Sign In</span>
<span class="material-symbols-outlined text-on-primary-container group-hover:translate-x-1 transition-transform" data-icon="arrow_forward">arrow_forward</span>
</button>
</form>
<!-- Secondary CTA -->
<div class="mt-8 text-center">
<p class="text-on-surface-variant text-sm font-body">
                    Not monitored yet? 
                    <a class="text-secondary font-bold hover:underline underline-offset-4 ml-1 transition-all" href="#">Create Account</a>
</p>
</div>
</div>
<!-- Trust Footer -->
<div class="mt-12 flex flex-col items-center gap-4 text-center opacity-40 hover:opacity-80 transition-opacity">
<div class="flex items-center gap-6">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-sm" data-icon="verified_user">verified_user</span>
<span class="font-label text-[10px] uppercase tracking-widest">End-to-End Encrypted</span>
</div>
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-sm" data-icon="eye_tracking">eye_tracking</span>
<span class="font-label text-[10px] uppercase tracking-widest">Live Safety Pulse</span>
</div>
</div>
<p class="text-[10px] font-label tracking-widest uppercase text-on-surface-variant">Offline-first • SQLite → sync to Supabase</p>
</div>
</main>
<!-- Side Decoration (Visual Only) -->
<div class="fixed top-12 left-12 hidden lg:block opacity-20">
<div class="w-32 h-32 border-l border-t border-primary/40 rounded-tl-3xl"></div>
</div>
<div class="fixed bottom-12 right-12 hidden lg:block opacity-20">
<div class="w-32 h-32 border-r border-b border-primary/40 rounded-br-3xl"></div>
</div>
</body></html>
